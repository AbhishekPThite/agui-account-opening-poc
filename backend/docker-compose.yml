# Local development only. Do not reuse these credentials outside your laptop.
services:
  postgres:
    image: postgres:16-alpine
    container_name: agui-account-opening-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agui_poc
      POSTGRES_USER: agui_poc
      POSTGRES_PASSWORD: agui_poc_dev_only
    ports:
      - "5432:5432"
    volumes:
      - agui_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agui_poc -d agui_poc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agui_postgres_data:
